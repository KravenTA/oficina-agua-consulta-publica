# docker-compose.yml — Feature 1: Consulta Pública con Captcha
#
# Levanta la feature completa con un solo comando:
#
#   cp .env.example .env          (ajustar valores)
#   docker compose up --build
#
# Orden de arranque:
#   1. mysql-replica  -> debe quedar "healthy"
#   2. api            -> espera a la réplica
#   3. web            -> espera al api (perfil "web", disponible desde HU-25)
#
# Aislamiento: todos los servicios viven en la red "consulta-net". En esta red NO
# existe la instancia MySQL del monolito, y el ApiRest solo conoce el host
# "mysql-replica". El monolito no se modifica.

name: oficina-agua-consulta

services:

  # --- Réplica MySQL del monolito (se carga en HU-22) ---------------------------
  mysql-replica:
    image: mysql:8.0
    container_name: consulta-mysql-replica
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${REPLICA_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${REPLICA_DB_NAME}
      # Credenciales del usuario de solo lectura. NO se pasan como MYSQL_USER/MYSQL_PASSWORD
      # porque la imagen oficial le daría todos los permisos. El script de db/replica/init
      # (HU-22) crea el usuario con permiso SELECT únicamente.
      REPLICA_DB_USER: ${REPLICA_DB_USER}
      REPLICA_DB_PASSWORD: ${REPLICA_DB_PASSWORD}
    ports:
      # Puerto del host distinto de 3306 para no chocar con el MySQL local (Laragon, XAMPP...).
      - "${REPLICA_DB_HOST_PORT:-3307}:3306"
    volumes:
      - replica-data:/var/lib/mysql
      - ./db/replica/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
      - consulta-net

  # --- ApiRest de consulta (Spring Boot, solo lectura) ---------------------------
  api:
    build:
      context: ./api
    container_name: consulta-api
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-8081}
      # Única base de datos que ve el ApiRest: la réplica.
      REPLICA_DB_HOST: mysql-replica
      REPLICA_DB_PORT: "3306"
      REPLICA_DB_NAME: ${REPLICA_DB_NAME}
      REPLICA_DB_USER: ${REPLICA_DB_USER}
      REPLICA_DB_PASSWORD: ${REPLICA_DB_PASSWORD}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "${API_PORT:-8081}:${API_PORT:-8081}"
    depends_on:
      mysql-replica:
        condition: service_healthy
    networks:
      - consulta-net

  # --- Capa Web con captcha (se implementa en HU-25 / HU-26) ----------------------
  # Perfil "web": no arranca con `docker compose up` hasta que exista web/Dockerfile.
  # Cuando la HU-25 lo agregue, se quita la línea "profiles" y arranca junto al resto.
  # Mientras tanto: docker compose --profile web up --build
  web:
    profiles: ["web"]
    build:
      context: ./web
    container_name: consulta-web
    restart: unless-stopped
    environment:
      # URL interna del ApiRest: solo la conoce el servidor, nunca el navegador.
      API_INTERNAL_URL: http://api:${API_PORT:-8081}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-recaptcha}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - consulta-net

networks:
  consulta-net:
    driver: bridge

volumes:
  replica-data:
