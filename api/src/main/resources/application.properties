spring.application.name=consulta-service
server.port=${API_PORT:8081}

# Swagger UI muestra el contrato YAML (contract-first) en vez de uno generado desde el codigo.
# No poner springdoc.api-docs.enabled=false: eso apaga tambien Swagger UI y da 404.
springdoc.swagger-ui.url=/openapi/consulta-api.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# --- Replica MySQL (solo lectura) ---
# En Docker Compose estas variables apuntan a mysql-replica:3306.
# Fuera de Docker (por ejemplo, desde IntelliJ) se usa la replica publicada en localhost:3307.
spring.datasource.url=jdbc:mysql://${REPLICA_DB_HOST:localhost}:${REPLICA_DB_PORT:3307}/${REPLICA_DB_NAME:oficina_agua}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${REPLICA_DB_USER:consulta_ro}
spring.datasource.password=${REPLICA_DB_PASSWORD:}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# Zona horaria para decidir si un recibo ya vencio (Guatemala no usa horario de verano).
consulta.zona-horaria=America/Guatemala

# --- Rate limit por IP (HU-24) ---
consulta.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:10}
consulta.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# Solo poner en true si el ApiRest esta detras de la capa Web, que envia la IP real del cliente.
consulta.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
